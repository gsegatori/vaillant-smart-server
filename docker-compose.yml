services:
  vaillant-smart-server:
    build: .
    container_name: vaillant-smart-server
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BIND_PORT:-5000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
